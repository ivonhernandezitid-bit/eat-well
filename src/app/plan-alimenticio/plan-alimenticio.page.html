<ion-content class="ion-padding">
  <div class="plan-wrapper">
    <div class="topbar">
      <ion-button fill="solid" class="filter-pill">
        All
        <ion-icon slot="end" name="chevron-down-outline"></ion-icon>
      </ion-button>

      <div class="search-block">
        <ion-input placeholder="Search ..." class="search-input"></ion-input>
        <ion-icon name="search-outline" class="search-icon"></ion-icon>
      </div>

      <ion-button fill="clear" class="scanner-button">
        <ion-icon name="scan-outline"></ion-icon>
      </ion-button>
    </div>

    <h1 class="screen-title">MEAL PLAN</h1>

    <div class="meal-list">
      <div class="meal-card breakfast-card">
        <div class="meal-icon-box breakfast-icon">
          <ion-icon name="cafe-outline"></ion-icon>
        </div>
        <div class="meal-copy">
          <h2>Breakfast</h2>
          <p>Oatmeal with banana, walnuts, and honey.</p>
        </div>
        <div class="meal-meta">
          <span>380 kcal</span>
          <span>10 min</span>
        </div>
      </div>

      <div class="meal-card lunch-card">
        <div class="meal-icon-box lunch-icon">
          <ion-icon name="restaurant-outline"></ion-icon>
        </div>
        <div class="meal-copy">
          <h2>Lunch</h2>
          <p>Grilled chicken breast with brown rice and salad.</p>
        </div>
        <div class="meal-meta">
          <span>480 kcal</span>
          <span>25 min</span>
        </div>
      </div>

      <div class="meal-card dinner-card">
        <div class="meal-icon-box dinner-icon">
          <ion-icon name="pizza-outline"></ion-icon>
        </div>
        <div class="meal-copy">
          <h2>Dinner</h2>
          <p>Tuna tacos with avocado and vegetables.</p>
        </div>
        <div class="meal-meta">
          <span>350 kcal</span>
          <span>12 min</span>
        </div>
      </div>
    </div>
  </div>
</ion-content>
