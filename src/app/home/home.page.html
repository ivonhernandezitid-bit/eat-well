<ion-content class="ion-padding">
  <div class="home-wrapper">
    <div class="topbar">
      <ion-button fill="clear" class="profile-button" routerLink="/datos-perfil">
        <img *ngIf="user?.profileImage; else profileIcon" [src]="user?.profileImage" alt="Foto de perfil" />
        <ng-template #profileIcon>
          <ion-icon name="person-circle-outline"></ion-icon>
        </ng-template>
      </ion-button>
      <ion-button fill="clear" class="profile-button" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="hero-section">
      <h1 class="hero-title">Hola {{ user?.name || 'usuario' }},</h1>
      <p class="hero-subtitle">Encuentra, organiza y disfruta comida saludable.</p>
    </div>

    <div class="tips-card">
      <div class="tips-copy">
        <span class="tips-label">Consejo del día</span>
        <p>{{ dailyTip }}</p>
      </div>
      <div class="tips-icon">
        <ion-icon [name]="dailyTipIcon"></ion-icon>
      </div>
    </div>

    <div class="section-title">Elige tus preferencias de comida</div>

    <div class="preferences-grid">
      <button class="preference-card vegetables" routerLink="/preferencias-alimentarias">
        <div class="preference-icon">
          <ion-icon name="leaf-outline"></ion-icon>
        </div>
        <span>Verduras</span>
      </button>

      <button class="preference-card fruits" routerLink="/preferencias-alimentarias">
        <div class="preference-icon">
          <ion-icon name="nutrition-outline"></ion-icon>
        </div>
        <span>Frutas</span>
      </button>
    </div>
  </div>
</ion-content>
