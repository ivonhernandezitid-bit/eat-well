<ion-content class="ion-padding">
  <div class="home-wrapper">
    <div class="topbar">
      <ion-button fill="clear" class="profile-button" routerLink="/datos-perfil">
        <ion-icon name="person-circle-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="hero-section">
      <h1 class="hero-title">Hello User,</h1>
      <p class="hero-subtitle">Find, track and eat healthy food.</p>
    </div>

    <div class="tips-card">
      <div class="tips-copy">
        <span class="tips-label">Daily Tips</span>
        <p>Drink 5 liter of water everyday.</p>
      </div>
      <div class="tips-icon">
        <ion-icon name="water-outline"></ion-icon>
      </div>
    </div>

    <div class="section-title">Choose your food preferences</div>

    <div class="preferences-grid">
      <button class="preference-card vegetables">
        <div class="preference-icon">
          <ion-icon name="leaf-outline"></ion-icon>
        </div>
        <span>Vegetables</span>
      </button>

      <button class="preference-card fruits">
        <div class="preference-icon">
          <ion-icon name="nutrition-outline"></ion-icon>
        </div>
        <span>Fruits</span>
      </button>
    </div>
  </div>
</ion-content>
